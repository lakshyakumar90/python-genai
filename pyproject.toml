[project]
name = "python-agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lakshyakumar90", email = "lakshyakumar5023@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "elevenlabs>=2.68.0",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-neo4j>=0.10.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-mongodb>=0.5.0",
    "mem0ai>=2.0.20",
    "pdfplumber>=0.11.10",
    "pyaudio>=0.2.14",
    "pydantic>=2.13.5",
    "pygame>=2.6.1",
    "pymongo>=4.17.0",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "sentence-transformers>=6.0.1",
    "speechrecognition[audio]>=3.17.0",
]

[project.scripts]
python-agentic-ai = "python_agentic_ai:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
